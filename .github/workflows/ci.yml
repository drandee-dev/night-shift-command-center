name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows, because the session buttons and the scheduled-task reader target it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s _dashboard/tests -v
